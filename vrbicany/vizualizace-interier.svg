<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Vizualizace interiéru nové haly</title>
  <desc id="desc">Ilustrační vizualizace interiéru haly s otevřeným prostorem a přirozeným světlem.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <rect x="70" y="120" width="1060" height="560" rx="24" fill="#ffffff" stroke="#cbd5f5" stroke-width="4"/>
  <rect x="140" y="200" width="400" height="70" fill="#e2e8f0"/>
  <rect x="140" y="300" width="720" height="30" fill="#e2e8f0"/>
  <rect x="140" y="360" width="720" height="30" fill="#e2e8f0"/>
  <rect x="140" y="420" width="720" height="30" fill="#e2e8f0"/>
  <rect x="140" y="480" width="480" height="30" fill="#e2e8f0"/>
  <rect x="70" y="560" width="1060" height="120" fill="#f1f5f9"/>
  <text x="110" y="170" font-family="system-ui, sans-serif" font-size="28" fill="#0f172a" font-weight="700">Vizualizace interiéru nové haly</text>
  <text x="110" y="610" font-family="system-ui, sans-serif" font-size="20" fill="#475569">Otevřený prostor, vysoké stropy a přirozené světlo</text>
</svg>
